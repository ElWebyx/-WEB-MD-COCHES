<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Mendoza Automoción: compraventa de coches de ocasión certificados y garantizados en Las Palmas de Gran Canaria. Financiación, taller y camper Volkswagen California.">
<title>Mendoza Automoción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
/* Concepto: sala de exposición en negro. Portada oscura con un corte rojo en diagonal, tipografía condensada grande, catálogo blanco y limpio, detalles de taller (faros, franjas, cuota). Tres colores: negro, blanco, rojo. */
:root{
  --bg:#ffffff; --surface:#f3f3f2; --ink:#0b0b0c; --muted:#5d6065; --line:#e1e1e0;
  --red:#d7141f; --red-hi:#ff3b46; --blk:#0b0b0c; --blk2:#151517; --blk-line:#2b2b2e; --wht:#ffffff;
  --f-display:'Barlow Condensed','Arial Narrow',Impact,sans-serif; --f-body:'Manrope','Segoe UI',system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b0b0c; --surface:#151517; --ink:#f4f4f3; --muted:#9b9da2; --line:#2b2b2e; --red:#ef2b36; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0b0c; --surface:#151517; --ink:#f4f4f3; --muted:#9b9da2; --line:#2b2b2e; --red:#ef2b36; color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);padding-left:var(--gl);padding-right:var(--gr)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:70;background:var(--blk)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-transform:uppercase;letter-spacing:.01em;line-height:.95;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto}
.band{margin-left:calc(-1*var(--gl));margin-right:calc(-1*var(--gr));padding-left:var(--gl);padding-right:var(--gr)}
/* cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:60;background:var(--blk);color:var(--wht);border-bottom:1px solid var(--blk-line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;text-decoration:none;min-width:0}
.brand img{height:42px;max-width:180px;object-fit:contain}
.wm{font-family:var(--f-display);font-weight:800;font-size:25px;letter-spacing:.06em;text-transform:uppercase;line-height:.9;display:flex;flex-direction:column}
.wm i{font-style:normal;font-weight:600;font-size:12px;letter-spacing:.5em;color:var(--red-hi);margin-top:3px}
nav.links{display:flex;gap:26px;align-items:center;font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
nav.links a{text-decoration:none;color:#c9c9cc} nav.links a:hover{color:#fff}
.open{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#c9c9cc;font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#7b7d82} .dot.on{background:#27c36b;box-shadow:0 0 0 0 rgba(39,195,107,.6);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(39,195,107,0)}100%{box-shadow:0 0 0 0 rgba(39,195,107,0)}}
.btn{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--red);color:#fff;padding:14px 26px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));transition:filter .2s}
.btn:hover{filter:brightness(1.12)}
.btn.line{background:transparent;color:inherit;border:1px solid currentColor;clip-path:none;padding:13px 24px}
.btn.sm{padding:8px 14px;font-size:14px;letter-spacing:.08em;clip-path:none}
.btn.sm.line{padding:7px 13px}
.btn.danger{background:transparent;color:var(--red);border:1px solid var(--red);clip-path:none}
/* portada */
.hero{background:var(--blk);color:var(--wht);position:relative;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(115deg,transparent 52%,var(--red) 52%,var(--red) 70%,transparent 70%,transparent 72%,rgba(255,255,255,.08) 72%,rgba(255,255,255,.08) 73%,transparent 73%)}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:40px;align-items:center;padding-block:64px 72px}
.kicker{display:flex;align-items:center;gap:12px;font-size:12px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;color:var(--red-hi)}
.kicker::before{content:"";width:34px;height:3px;background:var(--red-hi)}
.hero h1{font-size:clamp(54px,9.4vw,128px);margin:18px 0 0;font-weight:800;line-height:.88}
.hero h1 em{font-style:normal;color:transparent;-webkit-text-stroke:2px #fff;display:block}
.hero p.lead{max-width:46ch;color:#cfcfd2;font-size:18px;margin:26px 0 32px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero .in{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
.hero .in.d2{animation-delay:.12s}.hero .in.d3{animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.feat{background:var(--blk2);border:1px solid var(--blk-line);cursor:pointer;display:block;text-align:left;width:100%;padding:0;color:inherit;position:relative}
.feat .ph{aspect-ratio:16/11}
.feat .meta{padding:20px 22px 22px;display:grid;gap:8px}
.feat .lab{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--red-hi);font-weight:700}
.feat h3{font-size:34px}
.feat .row2{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap}
.feat .specs{color:#b9b9bd}
/* fotos y placeholders */
.ph{aspect-ratio:4/3;background:var(--surface);position:relative;overflow:hidden;display:grid;place-items:center;color:var(--muted)}
.hero .ph{background:#1c1c1f;color:#55565b}
.ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.card:hover .ph img{transform:scale(1.05)}
.ph svg{width:62%;height:auto;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ph .cap{position:absolute;bottom:10px;left:14px;font-family:var(--f-display);font-weight:700;letter-spacing:.2em;font-size:13px;text-transform:uppercase}
.tag{position:absolute;top:0;left:0;background:var(--blk);color:#fff;font-family:var(--f-display);font-weight:700;font-size:14px;letter-spacing:.18em;text-transform:uppercase;padding:6px 14px 6px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.tag.res{background:#fff;color:var(--red)} .tag.new{background:var(--red)}
.specs{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13.5px;color:var(--muted)}
.price{font-family:var(--f-display);font-weight:700;font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
/* cinta de marcas */
.marq{background:var(--red);color:#fff;overflow:hidden;white-space:nowrap;border-block:1px solid #00000033}
.marq div{display:inline-flex;animation:slide 38s linear infinite;padding-block:14px}
.marq span{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.2em;text-transform:uppercase;padding-inline:26px}
.marq span::after{content:"/";margin-left:52px;opacity:.55}
@keyframes slide{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq div,.dot.on,.hero .in{animation:none}}
/* secciones */
section{padding-block:80px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:32px}
.sh h2{font-size:clamp(40px,6vw,72px)}
.sh h2 b{color:var(--red);font-weight:inherit}
.sub{color:var(--muted);max-width:50ch;margin:12px 0 0}
/* filtros */
.filters{position:sticky;top:calc(68px + env(safe-area-inset-top,0px));z-index:40;background:var(--bg);border-block:1px solid var(--line);margin-bottom:28px;padding-block:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:transparent;padding:7px 14px;font-size:13px;font-weight:600;letter-spacing:.04em}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1 1 20px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:0;padding:9px 12px;min-width:0;max-width:100%}
textarea{width:100%;min-height:84px;resize:vertical}
.count{font-size:13px;color:var(--muted);white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:26px}
.card{background:var(--bg);border:1px solid var(--line);position:relative;cursor:pointer;display:flex;flex-direction:column;min-width:0;text-align:left;padding:0}
.card::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:var(--red);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.card:hover::after,.card:focus-visible::after{transform:scaleX(1)}
.card .body{padding:20px 20px 22px;display:grid;gap:12px}
.card h3{font-size:26px;line-height:1}
.card .foot{display:flex;justify-content:space-between;align-items:end;gap:10px}
.card .cuota{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.sold .ph img{filter:grayscale(1);opacity:.5} .sold .price{color:var(--muted);text-decoration:line-through}
.empty{border:1px dashed var(--line);padding:56px 20px;text-align:center;color:var(--muted)}
/* camper */
.camper{background:var(--blk);color:#fff;position:relative;overflow:hidden}
.camper .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:48px;align-items:center;padding-block:88px}
.camper .big{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(70px,14vw,190px);line-height:.8;color:transparent;-webkit-text-stroke:2px #fff;margin:0 0 -6px}
.camper h2{font-size:clamp(34px,5vw,56px);margin-bottom:16px} .camper h2 b{color:var(--red-hi)}
.camper p{color:#cfcfd2;max-width:48ch}
.camper ul{list-style:none;margin:24px 0 30px;padding:0;display:grid;gap:10px}
.camper li{display:flex;gap:12px;align-items:center;font-weight:600} .camper li::before{content:"";width:22px;height:3px;background:var(--red-hi);flex:0 0 auto}
/* servicios */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));border-top:3px solid var(--ink)}
.svc div{padding:28px 28px 32px 0;border-bottom:1px solid var(--line)}
.svc h3{font-size:30px;margin-bottom:10px} .svc h3::before{content:"";display:block;width:28px;height:4px;background:var(--red);margin-bottom:16px}
.svc p{margin:0;color:var(--muted)}
/* financiación */
.fin{background:var(--surface)}
.calc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0;border:1px solid var(--line);background:var(--bg)}
.calc .ctl{padding:32px;display:grid;gap:22px}
.calc label{display:grid;gap:8px;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.calc label span{display:flex;justify-content:space-between;color:var(--ink);font-family:var(--f-display);font-size:22px;letter-spacing:.04em}
.calc input[type=range]{padding:0;border:0;accent-color:var(--red);width:100%;background:transparent}
.calc input[type=number]{font-family:var(--f-display);font-size:22px;font-weight:600}
.calc .out{background:var(--blk);color:#fff;padding:32px;display:grid;gap:14px;align-content:center;position:relative;overflow:hidden}
.calc .out::before{content:"";position:absolute;right:-60px;top:0;bottom:0;width:140px;background:var(--red);transform:skewX(-16deg);opacity:.9}
.calc .out>*{position:relative}
.calc .cuota-n{font-family:var(--f-display);font-weight:800;font-size:clamp(64px,9vw,104px);line-height:.9;font-variant-numeric:tabular-nums}
.calc .cuota-n small{font-size:28px;font-weight:600;letter-spacing:.06em}
.calc dl{margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 16px;font-size:14px;color:#d6d6d9} .calc dd{margin:0;font-weight:700;color:#fff;text-align:right}
.fine{font-size:12px;color:var(--muted);margin:14px 0 0;max-width:80ch}
.calc .out .fine{color:#c9c9cc}
/* contacto */
.contact{background:var(--blk);color:#fff}
.contact .wrap{padding-block:88px 56px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:56px}
.contact h2{font-size:clamp(44px,7vw,92px)} .contact h2 b{color:var(--red-hi)}
.phone{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,8vw,84px);line-height:1;margin:24px 0 8px;letter-spacing:.02em;user-select:all}
.contact h3{font-family:var(--f-body);font-size:12px;letter-spacing:.24em;color:var(--red-hi);margin:0 0 8px;font-weight:700}
.contact .blocks{display:grid;gap:26px;align-content:start}
.contact p{margin:0 0 4px;color:#d6d6d9}
.hours{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:15px;color:#d6d6d9} .hours b{color:#fff} .hours .today{color:var(--red-hi)}
footer{background:var(--blk);color:#8d8f94;font-size:13px;overflow:hidden}
footer .wrap{padding-block:0 28px}
footer .giant{font-family:var(--f-display);font-weight:800;text-transform:uppercase;font-size:clamp(48px,13.5vw,176px);line-height:.85;color:#17171a;letter-spacing:.02em;white-space:nowrap;margin:0 0 24px;user-select:none}
footer .fl{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--blk-line);padding-top:20px}
/* ficha */
dialog{border:0;background:var(--bg);color:var(--ink);padding:0;border-radius:0;width:min(980px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto}
dialog::backdrop{background:rgba(5,5,6,.78)}
.dlg{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}
.gal{background:var(--blk);position:relative}
.gal .ph{aspect-ratio:4/3;background:#1c1c1f;color:#55565b}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:56px;border:0;background:rgba(11,11,12,.7);color:#fff;font-size:22px} .nav.p{left:0}.nav.n{right:0}
.thumbs{display:flex;gap:6px;padding:8px;overflow-x:auto}
.thumbs button{border:2px solid transparent;padding:0;background:none;flex:0 0 auto} .thumbs button[aria-current="true"]{border-color:var(--red)}
.thumbs img{width:68px;height:50px;object-fit:cover;display:block}
.info{padding:34px 32px;display:grid;gap:18px;align-content:start;min-width:0}
.info h2{font-size:44px}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px;margin:0;border-block:1px solid var(--line);padding-block:18px}
.sl dt{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.16em;font-weight:700} .sl dd{margin:0;font-weight:700;font-size:17px}
.x{position:absolute;top:10px;right:10px;z-index:5;background:var(--bg);color:var(--ink);border:0;width:38px;height:38px;font-size:16px}
/* gestión */
.admin-bar{position:fixed;right:var(--gr);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:65;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100% - 32px)}
.admin-bar .btn{box-shadow:0 8px 24px rgba(0,0,0,.35)} .admin-bar .btn.line{background:var(--bg);color:var(--ink)}
.admin{padding:26px;display:grid;gap:18px}
.admin h2{font-size:34px}
.row{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.row .t{width:60px;height:45px;background:var(--surface);overflow:hidden} .row .t img{width:100%;height:100%;object-fit:cover}
.row .n{min-width:0} .row .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .row .n small{color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form label{display:grid;gap:4px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700} .form .full{grid-column:1/-1}
.form .ck{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos .p{position:relative} .photos img{width:90px;height:68px;object-fit:cover;display:block}
.photos button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--bg);line-height:1;padding:0}
.note{font-size:13px;color:var(--muted)} .dirty{color:var(--red);font-weight:700}
@media (max-width:820px){
  .hero .wrap,.camper .wrap,.contact .wrap,.calc,.dlg{grid-template-columns:1fr}
  .hero .wrap{padding-block:44px 52px} .hero::before{background:linear-gradient(160deg,transparent 70%,var(--red) 70%)}
  nav.links a.opt{display:none} .form{grid-template-columns:1fr} section{padding-block:56px}
  .row{grid-template-columns:48px minmax(0,1fr)} .row .acts{grid-column:1/-1;justify-content:flex-start}
  .filters{position:static} .info{padding:24px 20px}
}
</style>
</head>

<script id="appjs">
(function(){
const $=(s,r=document)=>r.querySelector(s);
const INFO={tel:'928 47 03 47',email:'mendozaautomocion@gmail.com',dir:'Calle Castillejos 37-39, 35010 Las Palmas de Gran Canaria',
  fb:'https://www.facebook.com/mendozaautomocion',ig:'https://www.instagram.com/mendozaautomocion/'};

const KEY='mendoza-automocion-coches-v1';
try{const sv=localStorage.getItem(KEY);if(sv&&location.hash==='#admin')state=JSON.parse(sv)}catch(e){}
let F={q:'',orden:'recientes',comb:'Todos',cambio:'Todos',vendidos:false};
let art=null,isAdmin=false,dirty=false,editing=null,draft=null,confirmDel=null;
const nf=n=>Number(n||0).toLocaleString('es-ES');
const eur=n=>nf(n)+' €', kmf=n=>nf(n)+' km';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tit=c=>`${c.marca} ${c.modelo}`;
const CAR='<svg viewBox="0 0 200 80" aria-hidden="true"><path d="M8 58 L16 47 Q20 41 30 39 L58 35 Q74 14 100 12 L134 12 Q152 15 164 35 L186 41 Q196 45 196 56 L196 60 L8 60Z"/><path d="M70 36 L84 20 L130 20 L146 36Z"/><circle cx="50" cy="60" r="12" fill="var(--ph-fill,transparent)"/><circle cx="154" cy="60" r="12" fill="var(--ph-fill,transparent)"/></svg>';

function cuota(P,entradaPct=20,meses=60,tin=8){const cap=P*(1-entradaPct/100);const r=tin/1200;if(!cap)return 0;return r?cap*r/(1-Math.pow(1+r,-meses)):cap/meses}
/* horario en hora de Canarias */
function horario(){
  const p=new Intl.DateTimeFormat('en-GB',{timeZone:'Atlantic/Canary',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;const wd=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(g('weekday'));
  const m=(+g('hour')%24)*60+ +g('minute');const lab=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  const lab2=['dom','lun','mar','mié','jue','vie','sáb'];
  let on=false,txt='Cerrado ahora';
  if(wd>=1&&wd<=5){
    if((m>=540&&m<840)||(m>=960&&m<1200)){on=true;txt='Abierto ahora'}
    else if(m<540)txt='Cerrado · abre a las 9:00';
    else if(m>=840&&m<960)txt='Cerrado · abre a las 16:00';
    else txt=wd===5?'Cerrado · abre el lunes a las 9:00':'Cerrado · abre mañana a las 9:00';
  }else txt='Cerrado · abre el lunes a las 9:00';
  return{on,txt,wd};
}

function filtrar(estados){
  let l=state.cars.filter(c=>estados.includes(c.estado));
  const q=F.q.trim().toLowerCase();
  if(q)l=l.filter(c=>(tit(c)+' '+c.combustible+' '+c.anio).toLowerCase().includes(q));
  if(F.comb!=='Todos')l=l.filter(c=>c.combustible===F.comb);
  if(F.cambio!=='Todos')l=l.filter(c=>c.cambio===F.cambio);
  const o=F.orden;
  if(o==='precio-asc')l.sort((a,b)=>a.precio-b.precio);else if(o==='precio-desc')l.sort((a,b)=>b.precio-a.precio);
  else if(o==='km')l.sort((a,b)=>a.km-b.km);else if(o==='anio')l.sort((a,b)=>b.anio-a.anio);else l.reverse();
  return l;
}

function calc(){
  const P=+$('#c-precio').value,E=+$('#c-ent').value,M=+$('#c-mes').value,T=+$('#c-tin').value||0;
  const q=cuota(P,E,M,T),fin=P*(1-E/100),tot=q*M;
  $('#o-precio').textContent=eur(P);$('#o-ent').textContent=E+' %';$('#o-mes').textContent=M+' meses';
  $('#r-cuota').textContent=nf(Math.round(q));$('#r-fin').textContent=eur(Math.round(fin));$('#r-ent').textContent=eur(Math.round(P*E/100));$('#r-int').textContent=eur(Math.max(0,Math.round(tot-fin)));
}

  <p class="note dirty" id="err"></p>
  <div class="acts" style="justify-content:flex-end"><button class="btn sm line" id="cancel">Cancelar</button><button class="btn sm" id="save">Guardar coche</button></div></div>`;
  const leer=()=>{d.marca=$('#f-marca',a).value.trim();d.modelo=$('#f-modelo',a).value.trim();d.anio=+$('#f-anio',a).value;d.km=+$('#f-km',a).value;d.precio=+$('#f-precio',a).value;d.estado=$('#f-estado',a).value;d.combustible=$('#f-comb',a).value;d.cambio=$('#f-cambio',a).value;d.desc=$('#f-desc',a).value.trim();d.destacado=$('#f-dest',a).checked};
  a.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{leer();d.fotos.splice(+b.dataset.rm,1);panel()});
  $('#f-fotos',a).onchange=async e=>{leer();for(const f of e.target.files){d.fotos.push(await reducir(f,1000,'image/jpeg'))}panel()};
  $('#cancel',a).onclick=()=>{editing=null;draft=null;panel()};
  $('#save',a).onclick=()=>{leer();if(!d.marca||!d.modelo){$('#err',a).textContent='Escribe la marca y el modelo.';return}
    if(d.destacado)state.cars.forEach(c=>c.destacado=false);
    if(editing==='new')state.cars.push(d);else state.cars=state.cars.map(c=>c.id===d.id?d:c);
    editing=null;draft=null;cambio();panel()};
}
function reducir(file,max,tipo){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*s);cv.height=Math.round(im.height*s);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(tipo,.82))};im.src=r.result};r.readAsDataURL(file)})}
function cambio(){dirty=true;try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}const keepP=$('#c-precio')?$('#c-precio').value:null;renderSite();if(keepP){$('#c-precio').value=keepP;calc()}renderBar()}
function renderBar(){
  const b=$('#adminbar');if(!isAdmin){b.innerHTML='';return}
  b.innerHTML=`<div class="admin-bar">${dirty?'<button class="btn" id="pub">Copiar datos para la web</button>':''}<button class="btn ${dirty?'line':''}" id="gest">Gestionar coches</button></div>`;
  $('#gest').onclick=()=>panel();const p=$('#pub');if(p)p.onclick=publicar;
}
async function publicar(){
  const json=JSON.stringify(state,null,1).replace(/</g,'\\u003c');
  const a=$('#adm');
  let ok=false;try{await navigator.clipboard.writeText(json);ok=true}catch(e){}
  a.innerHTML=`<div class="admin"><h2>Datos para la web</h2>
   <p class="note">${ok?'Ya están copiados.':'No se pudo copiar solo: selecciona todo el texto y cópialo.'} Abre el archivo HTML, busca <b>id="data"</b> y sustituye todo lo que hay entre las etiquetas <b>&lt;script type="application/json" id="data"&gt;</b> y <b>&lt;/script&gt;</b> por este contenido. Luego sube el archivo a tu hosting.</p>
   <textarea id="exp" readonly style="min-height:260px;font:12px/1.4 monospace"></textarea>
   <div class="acts" style="justify-content:flex-end"><button class="btn sm line" id="x2">Cerrar</button></div></div>`;
  $('#exp',a).value=json;$('#exp',a).onfocus=e=>e.target.select();
  $('#x2',a).onclick=()=>{a.close()};
  if(!a.open)a.showModal();
  $('#exp',a).select();
}
$('#app').innerHTML='<div id="site"></div><div id="adminbar"></div><dialog id="dlg"></dialog><dialog id="adm"></dialog>';
['dlg','adm'].forEach(id=>$('#'+id).addEventListener('click',e=>{if(e.target.id===id)e.target.close()}));
renderSite();
setInterval(()=>{const o=$('#open');if(o){const h=horario();o.innerHTML=`<i class="dot ${h.on?'on':''}"></i>${h.txt}`}},60000);
function chk(){isAdmin=location.hash==='#admin';if(isAdmin){try{const sv=localStorage.getItem(KEY);if(sv)state=JSON.parse(sv)}catch(e){}renderSite()}renderBar()}
window.addEventListener('hashchange',chk);chk();
})();
</script>
</body>
</html>

<!--
=====================  INSTRUCCIONES  =====================
Subir la web: sube este único archivo (index.html) a cualquier hosting estático
(Netlify, GitHub Pages, Cloudflare Pages, tu hosting habitual).

Gestionar los coches, dos formas:
1) Panel: abre la web con #admin al final (ejemplo: https://tudominio.es/#admin).
   Aparece el botón "Gestionar coches": añadir, editar, marcar vendido, reservar,
   eliminar, subir fotos y logo. Los cambios se guardan en ese navegador.
   Para publicarlos, pulsa "Copiar datos para la web", pega el contenido en el
   archivo (bloque <script type="application/json" id="data">) y vuelve a subirlo.
2) A mano: edita directamente el bloque id="data". Cada coche tiene "estado":
   "venta", "reservado" o "vendido". Para quitar un coche, borra su bloque.

Importante: #admin no es una contraseña. Cualquiera que lo escriba verá el panel,
pero sus cambios solo se guardan en su navegador y no afectan a la web pública.
Fotos: se guardan dentro del archivo; con muchas fotos pesará. Para una web
con muchos coches conviene alojar las fotos aparte y poner su URL en "fotos".
-->
